# Copy to config/local.properties (git-ignored) and fill in your own values.
# Never commit config/local.properties.

# IP address of the TV on your LAN (give it a fixed IP / DHCP reservation in your router)
tv_host=192.0.2.10
# Pre-Shared Key set on the TV: Settings > Network > Home network > IP control
tv_psk=change-me
# Name used in the greeting ("Good morning, <name>"); leave empty for "Good morning"
greeting_name=
# Weather location: town-level coordinates are enough, no street address needed
latitude=48.2082
longitude=16.3738
location_name=Vienna
# IANA timezone of the location
timezone=Europe/Vienna
# Minutes until the TV goes back to standby after an alarm start
standby_minutes=30
# Optional: secret iCal address of your Google calendar (Google Calendar > Settings > your calendar >
# "Secret address in iCal format"). Read-only; keep it private. Empty = off.
google_ical_url=
# Optional: switch the Google calendar off without removing the address (true/false)
google_enabled=true
# Optional: Davis WeatherLink Live on your LAN (host or host:port). If set, its outdoor temperature
# replaces Open-Meteo's current temperature; Open-Meteo stays the fallback and provides the rest.
weatherlink_host=
weatherlink_enabled=true
# Language of the screen: auto (follow the TV), de or en
language=auto
# Screen layout: timeline (weather + appointments on one time graph) or classic (two cards)
layout=timeline
# How 2+ appointments are shown in the classic layout: timeline (day view) or list
calendar_style=timeline
# Name of your home Wi-Fi (used only in the iPhone Shortcut, not sent to the TV)
home_wifi=MyHomeWifi
